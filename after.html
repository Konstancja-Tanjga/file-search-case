<style>
/* One screen, one task: build conditions above the folder list, then Search. Tokens only. */
html, body { margin: 0; background: var(--bh-surface-base); color: var(--bh-text-primary); font-family: var(--bh-font-family); }
.sx { max-width: 1120px; margin: 0 auto; padding: var(--bh-gap-loose) var(--bh-padding-section); display: flex; flex-direction: column; gap: var(--bh-gap-normal); }
.sx-top { display: flex; align-items: center; gap: var(--bh-gap-normal); color: var(--bh-text-secondary); font-size: var(--bh-text-size-caption); }
.sx-logo { display: inline-flex; align-items: center; gap: var(--bh-gap-snug); color: var(--bh-text-primary); font-weight: var(--bh-text-weight-heading); }
.sx-logo i { width: 14px; height: 14px; border-radius: var(--bh-radius-pill); background: var(--bh-selection-mark); }
.sx-meta { margin: 0; color: var(--bh-text-muted); font-size: var(--bh-text-size-caption); }

/* The search bar is the hero: one row, wraps when it grows */
.sx-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bh-gap-snug); padding: var(--bh-gap-snug); border-radius: var(--bh-radius-surface); background: var(--bh-surface-raised); border: 1px solid var(--bh-border-subtle); }
.sx-bar:focus-within { border-color: var(--bh-border-focus); }
.sx-anchor { position: relative; display: inline-flex; }
.sx-chip { display: inline-flex; border: 1px solid var(--bh-border-subtle); }
.sx-chip .bh-chip__label { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.sx-chip .bh-chip__label b { font-weight: var(--bh-text-weight-emphasis); }
.sx-chip--loc { border-color: var(--bh-selection-mark); }
.sx-chip--loc .bh-chip__label::after { content: '▾'; margin-left: var(--bh-gap-tight); color: var(--bh-text-secondary); }
.sx-input { flex: 1 1 200px; min-width: 160px; border: 0; background: transparent; color: var(--bh-text-primary); font: inherit; font-size: var(--bh-text-size-body); padding: 0 var(--bh-gap-snug); height: var(--bh-control-md); outline: none; }
.sx-input::placeholder { color: var(--bh-text-muted); }
.sx-actions { display: inline-flex; gap: var(--bh-gap-snug); margin-left: auto; }

/* Popovers: menu (add / location / suggestions) and the condition editor */
.sx-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 220px; padding: var(--bh-gap-tight); border-radius: var(--bh-radius-surface); background: var(--bh-surface-raised); border: 1px solid var(--bh-border-subtle); box-shadow: var(--bh-elevation-floating, var(--bh-elevation-raised)); }
.sx-pop[hidden] { display: none; }
.sx-pop ul { list-style: none; margin: 0; padding: 0; }
.sx-opt { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: var(--bh-gap-loose); min-height: var(--bh-control-md); padding: 0 var(--bh-padding-inline); border: 0; border-radius: var(--bh-radius-control); background: none; color: var(--bh-text-primary); font: inherit; font-size: var(--bh-text-size-caption); text-align: left; cursor: pointer; }
.sx-opt:hover, .sx-opt[aria-selected="true"], .sx-opt:focus-visible { background: var(--bh-fill-hover); outline: none; }
.sx-opt small { color: var(--bh-text-muted); }
.sx-editor { display: flex; flex-direction: column; gap: var(--bh-gap-normal); padding: var(--bh-gap-normal); min-width: 300px; }
.sx-editor h3 { margin: 0; font-size: var(--bh-text-size-caption); color: var(--bh-text-secondary); font-weight: var(--bh-text-weight-emphasis); }
.sx-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bh-gap-snug); }
.sx-row .bh-input { width: 7ch; flex: none; }
.sx-row .bh-input.sx-wide { width: 100%; flex: 1 1 160px; }
.sx-row .bh-select-wrapper { width: auto; }
.sx-hint { margin: 0; color: var(--bh-text-muted); font-size: var(--bh-text-size-dense); }
.sx-suggest { display: flex; flex-wrap: wrap; gap: var(--bh-gap-tight); }
.sx-suggest button { border: 1px solid var(--bh-border-subtle); border-radius: var(--bh-radius-pill); background: none; color: var(--bh-text-secondary); font: inherit; font-size: var(--bh-text-size-dense); padding: 2px var(--bh-gap-snug); cursor: pointer; }
.sx-suggest button:hover { color: var(--bh-text-primary); border-color: var(--bh-text-secondary); }
.sx-editor footer { display: flex; justify-content: flex-end; gap: var(--bh-gap-snug); }

/* The folder list: quiet backdrop */
.sx-list { border-radius: var(--bh-radius-surface); overflow-x: auto; }
.sx-list .bh-table td, .sx-list .bh-table th { white-space: nowrap; }
.sx-list .bh-table td:first-child { color: var(--bh-text-primary); }
.sx-list .bh-table td { color: var(--bh-text-secondary); }
.sx-state { padding: var(--bh-padding-section) 0; }
.sx-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 640px) { .sx { padding: var(--bh-gap-normal); } .sx-actions { margin-left: 0; width: 100%; } .sx-actions .bh-button { flex: 1; } .sx-pop { position: fixed; left: var(--bh-gap-normal); right: var(--bh-gap-normal); top: auto; } .sx-editor { min-width: 0; } }

<div class="sx">

  <form class="sx-bar" id="bar" role="search" aria-label="Search files" autocomplete="off">

      <span class="bh-chip sx-chip sx-chip--loc"><button type="button" class="bh-chip__label" id="locBtn" aria-haspopup="listbox" aria-expanded="false">In <b id="locName">2023-wgs</b></button></span>
      <div class="sx-pop" id="locPop" hidden><ul role="listbox" aria-label="Where to search" id="locList"></ul></div>

    <span class="sx-anchor" style="flex:1 1 220px">
      <label class="sx-vh" for="q">Type a name or an extension</label>
      <input class="sx-input" id="q" placeholder="Type a name or an extension, e.g. .cram" role="combobox" aria-expanded="false" aria-controls="qList" aria-autocomplete="list">
      <div class="sx-pop" id="qPop" hidden><ul role="listbox" id="qList" aria-label="Add as condition"></ul></div>

    <span class="sx-actions">
      <span class="sx-anchor">

      <button type="submit" class="bh-button bh-button--primary bh-button--md bh-focusable" id="go" disabled>Search</button>

  <div class="sx-anchor" id="editAnchor" style="display:block;height:0"></div>
  <p class="sx-meta" id="meta"></p><p class="sx-vh" id="live" aria-live="polite"></p>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const FILES = [
    ['qc-report-batch07.pdf', 212e6, '2023-04-02'], ['sample-NA12878.cram', 184.2e9, '2023-02-11'],
    ['sample-NA12878.cram.crai', 2e6, '2023-02-11'], ['variant-calls-v3.vcf.gz', 41.7e9, '2023-06-18'],
    ['methods-supplement.pdf', 119e6, '2022-11-30'], ['fig3-coverage.tif', 3.4e9, '2023-07-22'],
    ['alignment.log', 9e6, '2023-02-12'], ['grant-report-2023.pdf', 96e6, '2023-12-20'],
    ['batch07-raw.tar', 940e9, '2023-03-05'], ['README.md', 12e3, '2024-05-01'],
    ['nextflow.config', 4e3, '2026-10-12'], ['coverage-summary.xlsx', 3e6, '2023-08-14']];
  const PLACES = [['2023-wgs', 'This folder · 48.2 M files'], ['projects', 'Parent folder · 312 M files'], ['genomics-lab', 'This zone · 1.8 B files'], ['all storage', 'All zones · 20 B files, can take minutes']];
  const EXT = ['pdf', 'cram', 'bam', 'fastq.gz', 'vcf.gz', 'tif', 'tar', 'csv', 'xlsx', 'docx'];
  const FIELDS = { type: 'Type', size: 'Size', modified: 'Modified', name: 'Name' };
  const fmtB = b => { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1000 && i < 4) { b /= 1000; i++; } return (i > 1 ? b.toFixed(1) : b.toFixed(0)) + ' ' + u[i]; };
  const extOf = n => { const m = n.toLowerCase().match(/\.((?:fastq|vcf|tar)\.gz|[a-z0-9]+)$/); return m ? m[1] : ''; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let loc = '2023-wgs'; let conds = []; let seq = 1;

  // ---- folder list (backdrop) ----
  $('#rows').innerHTML = FILES.map(([n, s, d]) => `<tr><td>${esc(n)}</td><td>${esc(extOf(n).toUpperCase() || '—')}</td><td data-align="end">${fmtB(s)}</td><td>${new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</td></tr>`).join('');

  // ---- labels: each chip reads as part of one sentence ----
  const label = c => {
    if (c.f === 'type') return `Type <b>${c.v.map(x => '.' + x).join(', ') || '…'}</b>`;
    if (c.f === 'size') return `Size <b>${c.op === 'gt' ? '>' : '<'} ${c.n || '…'} ${c.u}</b>`;
    if (c.f === 'modified') return c.op === 'gt' ? `Not modified for <b>${c.n || '…'} ${unit(c.n, c.u)}</b>` : `Modified in the last <b>${c.n || '…'} ${unit(c.n, c.u)}</b>`;
    return `Name <b>${c.op} “${esc(c.v || '…')}”</b>`;
  };
  const plain = c => label(c).replace(/<[^>]+>/g, '');
  const unit = (n, u) => (+n === 1 ? u.replace(/s$/, '') : u);

  // ---- popovers: one open at a time; Esc closes and returns focus ----
  let openPop = null, returnTo = null;
  function closePop(focusBack) { if (!openPop) return; openPop.hidden = true; document.querySelectorAll('[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); if (focusBack && returnTo) returnTo.focus(); openPop = null; }
  function showPop(pop, trigger) { closePop(false); pop.hidden = false; openPop = pop; returnTo = trigger; if (trigger) trigger.setAttribute('aria-expanded', 'true'); }
  document.addEventListener('mousedown', e => { if (openPop && !openPop.contains(e.target) && !e.target.closest('[aria-expanded="true"]')) closePop(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openPop) { e.preventDefault(); const wasEditor = openPop.dataset.editor; closePop(true); if (wasEditor) dropEmpty(); } });

  // ---- location: one chip, the only place it is shown and changed ----
  $('#locList').innerHTML = PLACES.map(([n, d]) => `<li><button type="button" class="sx-opt" role="option" data-loc="${esc(n)}"><span>${esc(n)}</span><small>${esc(d)}</small></button></li>`).join('');
  $('#locBtn').addEventListener('click', () => { showPop($('#locPop'), $('#locBtn')); $('#locList').querySelector(`[data-loc="${loc}"]`).focus(); });
  $('#locList').addEventListener('click', e => { const b = e.target.closest('[data-loc]'); if (!b) return; loc = b.dataset.loc; $('#locName').textContent = loc; closePop(true); render(); });
  menuKeys($('#locList'));

  // ---- add condition menu ----
  $('#addList').innerHTML = Object.entries(FIELDS).map(([k, v]) => `<li role="none"><button type="button" class="sx-opt" role="menuitem" data-f="${k}">${v}<small>${{ type: 'e.g. .pdf, .cram', size: 'e.g. > 100 MB', modified: 'e.g. not for 1 year', name: 'e.g. contains report' }[k]}</small></button></li>`).join('');
  $('#addBtn').addEventListener('click', () => { showPop($('#addPop'), $('#addBtn')); $('#addList button').focus(); });
  $('#addList').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; closePop(false); const c = blank(b.dataset.f); conds.push(c); render(); edit(c, true); });
  menuKeys($('#addList'));

  function blank(f) { const id = seq++; return f === 'type' ? { id, f, v: [] } : f === 'size' ? { id, f, op: 'gt', n: '', u: 'MB' } : f === 'modified' ? { id, f, op: 'gt', n: '', u: 'years' } : { id, f, op: 'contains', v: '' }; }
  const filled = c => c.f === 'type' ? c.v.length > 0 : c.f === 'name' ? !!c.v.trim() : !!c.n;
  function dropEmpty() { const before = conds.length; conds = conds.filter(filled); if (conds.length !== before) render(); }

  // ---- chips: click to edit, × to remove ----
  function render() {
    $('#chips').innerHTML = conds.map(c => `<span class="sx-anchor" data-anchor="${c.id}"><span class="bh-chip bh-chip--removable sx-chip"><button type="button" class="bh-chip__label" data-edit="${c.id}" aria-label="Edit condition: ${esc(plain(c))}">${label(c)}</button><button type="button" class="bh-chip__remove bh-focusable" data-rm="${c.id}" aria-label="Remove condition: ${esc(plain(c))}">×</button></span></span>`).join('');
    const ok = conds.filter(filled);
    $('#go').disabled = !ok.length;
    // the chips are the readback; the hint shows only while there is nothing to read back
    $('#meta').hidden = !!conds.length; $('#meta').textContent = 'Add a condition, or type a name or an extension.';
    $('#live').textContent = ok.length ? 'Find files in ' + loc + ': ' + ok.map(plain).join(', ') : '';
  }
  $('#chips').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if (rm) { conds = conds.filter(c => c.id !== +rm.dataset.rm); render(); $('#q').focus(); return; }
    const ed = e.target.closest('[data-edit]'); if (ed) edit(conds.find(c => c.id === +ed.dataset.edit), false);
  });

  // ---- editor: one small popover per condition ----
  function sel(id, opts, val) { return `<div class="bh-select-wrapper"><select class="bh-select bh-focusable" id="${id}">${opts.map(([v, t]) => `<option value="${v}"${v === val ? ' selected' : ''}>${t}</option>`).join('')}</select><span class="bh-select__chevron" aria-hidden="true"></span></div>`; }
  function edit(c, isNew) {
    const anchor = document.querySelector(`[data-anchor="${c.id}"]`);
    const pop = document.createElement('div'); pop.className = 'sx-pop'; pop.dataset.editor = '1'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', FIELDS[c.f] + ' condition');
    let body = '';
    if (c.f === 'type') body = `<div class="sx-row"><label class="sx-vh" for="e1">Extensions</label><input class="bh-input bh-focusable sx-wide" id="e1" value="${esc(c.v.join(', '))}" placeholder="pdf, cram"></div><p class="sx-hint">Any extension. Separate several with commas.</p><div class="sx-suggest">${EXT.map(x => `<button type="button" data-ext="${x}">.${x}</button>`).join('')}</div>`;
    if (c.f === 'size') body = `<div class="sx-row">${sel('e0', [['gt', 'larger than'], ['lt', 'smaller than']], c.op)}<label class="sx-vh" for="e1">Size</label><input class="bh-input bh-focusable" id="e1" inputmode="decimal" value="${esc(c.n)}" placeholder="100">${sel('e2', [['KB', 'KB'], ['MB', 'MB'], ['GB', 'GB'], ['TB', 'TB']], c.u)}</div>`;
    if (c.f === 'modified') body = `<div class="sx-row">${sel('e0', [['gt', 'not modified for'], ['lt', 'modified in the last']], c.op)}<label class="sx-vh" for="e1">Amount</label><input class="bh-input bh-focusable" id="e1" inputmode="numeric" value="${esc(c.n)}" placeholder="1">${sel('e2', [['days', 'days'], ['months', 'months'], ['years', 'years']], c.u)}</div>`;
    if (c.f === 'name') body = `<div class="sx-row">${sel('e0', [['contains', 'contains'], ['starts with', 'starts with'], ['ends with', 'ends with']], c.op)}<label class="sx-vh" for="e1">Text</label><input class="bh-input bh-focusable sx-wide" id="e1" value="${esc(c.v)}" placeholder="report"></div>`;
    pop.innerHTML = `<form class="sx-editor"><h3>${FIELDS[c.f]}</h3>${body}<footer><button type="button" class="bh-button bh-button--ghost bh-button--sm bh-focusable" data-cancel>${isNew ? 'Cancel' : 'Remove'}</button><button type="submit" class="bh-button bh-button--primary bh-button--sm bh-focusable">Done</button></footer></form>`;
    anchor.appendChild(pop); showPop(pop, anchor.querySelector('[data-edit]'));
    const f = pop.querySelector('form'), e0 = pop.querySelector('#e0'), e1 = pop.querySelector('#e1'), e2 = pop.querySelector('#e2');
    pop.querySelectorAll('[data-ext]').forEach(b => b.addEventListener('click', () => { const cur = e1.value.split(',').map(s => s.trim()).filter(Boolean); if (!cur.includes(b.dataset.ext)) cur.push(b.dataset.ext); e1.value = cur.join(', '); e1.focus(); }));
    pop.querySelector('[data-cancel]').addEventListener('click', () => { conds = conds.filter(x => x.id !== c.id); closePop(false); render(); $('#addBtn').focus(); });
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      if (c.f === 'type') c.v = e1.value.split(',').map(s => s.trim().replace(/^\*?\./, '').toLowerCase()).filter(Boolean);
      else if (c.f === 'name') { c.op = e0.value; c.v = e1.value.trim(); }
      else { c.op = e0.value; c.n = e1.value.replace(',', '.').trim(); c.u = e2.value; }
      if (!filled(c)) { e1.setAttribute('aria-invalid', 'true'); e1.classList.add('bh-input--invalid'); e1.focus(); return; }
      closePop(false); render(); $('#go').focus();
    });
    e1.focus(); e1.select && e1.select();
  }

  // ---- free text: ".cram" becomes a Type condition, other text a Name condition ----
  let active = -1, items = [];
  function suggest() {
    const t = $('#q').value.trim(); if (!t) { $('#qPop').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); return; }
    const ext = t.replace(/^\*?\./, '').toLowerCase();
    items = t.startsWith('.') || t.startsWith('*.') ? [['type', ext, `Type is <b>.${esc(ext)}</b>`], ['name', t, `Name contains <b>“${esc(t)}”</b>`]] : [['name', t, `Name contains <b>“${esc(t)}”</b>`], ['type', ext, `Type is <b>.${esc(ext)}</b>`]];
    active = 0;
    $('#qList').innerHTML = items.map((it, i) => `<li><button type="button" class="sx-opt" role="option" id="qo${i}" aria-selected="${i === 0}" data-i="${i}"><span>${it[2]}</span><small>${i === 0 ? 'Enter' : ''}</small></button></li>`).join('');
    $('#qPop').hidden = false; openPop = $('#qPop'); returnTo = $('#q'); $('#q').setAttribute('aria-expanded', 'true'); $('#q').setAttribute('aria-activedescendant', 'qo0');
  }
  function take(i) { const [f, v] = items[i]; const c = blank(f); if (f === 'type') c.v = [v]; else c.v = v; conds.push(c); $('#q').value = ''; $('#qPop').hidden = true; openPop = null; $('#q').setAttribute('aria-expanded', 'false'); render(); $('#q').focus(); }
  $('#q').addEventListener('input', suggest);
  $('#q').addEventListener('keydown', e => {
    if ($('#qPop').hidden) { if (e.key === 'Backspace' && !$('#q').value && conds.length) { conds.pop(); render(); } return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; $('#qList').querySelectorAll('.sx-opt').forEach((b, i) => b.setAttribute('aria-selected', String(i === active))); $('#q').setAttribute('aria-activedescendant', 'qo' + active); }
    if (e.key === 'Enter') { e.preventDefault(); take(active); }
  });
  $('#qList').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) take(+b.dataset.i); });

  // ---- arrow keys inside menus ----
  function menuKeys(list) { list.addEventListener('keydown', e => { if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return; e.preventDefault(); const bs = [...list.querySelectorAll('button')]; const i = bs.indexOf(document.activeElement); bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus(); }); }

  // ---- Search: the flow ends here, with a searching state and Cancel ----
  $('#bar').addEventListener('submit', e => {
    e.preventDefault(); if ($('#q').value.trim() && !$('#qPop').hidden) { take(active); return; }
    const ok = conds.filter(filled); if (!ok.length) return;
    $('#list').hidden = true; const st = $('#state'); st.hidden = false;
    st.innerHTML = `<div class="bh-stateblock bh-stateblock--section"><span class="bh-stateblock__spinner" aria-hidden="true"></span><h2 class="bh-stateblock__title">Searching ${esc(loc)}…</h2>${loc === 'all storage' ? '<p class="bh-stateblock__description">A search across all zones can take a few minutes.</p>' : ''}<div class="bh-stateblock__actions"><button type="button" class="bh-button bh-button--secondary bh-button--md bh-focusable" id="cancel">Cancel</button></div></div>`;
    $('#cancel').addEventListener('click', () => { st.hidden = true; $('#list').hidden = false; $('#go').focus(); });
    $('#cancel').focus();
  });

  render();
})();
</script>
</body>
</html>
